version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intellicam_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: intellicam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellicam"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intellicam_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:securepassword123@db:5432/intellicam
      - SECRET_KEY=super-secret-key-change-in-production-1234567890
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/workspace
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intellicam_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    working_dir: /workspace
    depends_on:
      - backend

volumes:
  pgdata:
